[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "aidial-adapter-vertexai"
version = "0.32.1"
description = "DIAL adapter for Google Vertex AI"
authors = [{ name = "EPAM RAIL", email = "SpecialEPM-DIALDevTeam@epam.com" }]
license = "Apache-2.0"
readme = "README.md"
keywords = ["ai"]
classifiers = ["Topic :: Software Development :: Libraries :: Python Modules"]
requires-python = ">=3.11,<4"
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://epam-rail.com"
Documentation = "https://epam-rail.com/dial_api"
Repository = "https://github.com/epam/ai-dial-adapter-vertexai/"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
aidial-sdk = { version = "0.33.1", extras = ["telemetry"] }
fastapi = "0.120.2"
google-cloud-aiplatform = "1.138.0"
google-auth = "2.48.0"
google-genai = "1.64.0"
openai = "1.107.3"
anthropic = { version = "0.75.0", extras = ["vertex"] }
pydantic = "2.10.4"
uvicorn = "0.22.0"
pillow = "12.1.1"
pypdf = { version = "6.9.2", extras = ["crypto"] }
numpy = "2.0.0"
aiohttp = "3.13.3"
urllib3 = "2.6.3"
azure-identity = "1.25.1"

[tool.poetry.group.test.dependencies]
pytest = "7.4.0"
pytest-asyncio = "0.21.1"
pytest-dotenv = "^0.5.2"
pytest-xdist = "^3.5.0"
pytest-html = "^4.1.1"
pytest-sugar = "^1.0.0"
pytest-timeout = "^2.3.1"
allure-pytest = "^2.13.5"
python-dotenv = "1.0.0"
requests = "^2.32.4"
asgi-lifespan = "^2.1.0"
httpx = "0.28.1"

[tool.poetry.group.lint.dependencies]
autoflake = "2.2.0"
black = "26.3.1"
flake8 = "6.0.0"
isort = "5.12.0"
pyright = "1.1.389"

[tool.poetry.group.dev.dependencies]
nox = "^2023.4.22"
google-auth-oauthlib = "1.0.0"

[tool.pytest.ini_options]
addopts = "-n=auto --asyncio-mode=auto --self-contained-html --html=pytest.html --alluredir=allure-results --timeout=60"
env_override_existing_values = 1
testpaths = ["tests"]
filterwarnings = [
  "error",
  # Warning from aiohttp
  "ignore:Sending a large body directly with raw bytes might lock the event loop. You should probably pass an io.BytesIO object instead:ResourceWarning",
  "ignore:pkg_resources is deprecated as an API:UserWarning",
  # muting warnings from google.rpc https://github.com/googleapis/google-cloud-python/issues/11184 and opentelemetry packages
  "ignore:Deprecated call to `pkg_resources\\.declare_namespace\\('.*'\\):DeprecationWarning",
  "ignore::DeprecationWarning:google.rpc",
  "ignore::DeprecationWarning:opentelemetry.instrumentation.dependencies",
  "ignore:Inheritance class AiohttpClientSession from ClientSession is discouraged:DeprecationWarning",
]

[tool.pyright]
typeCheckingMode = "basic"
reportUnusedVariable = "error"
reportIncompatibleMethodOverride = "error"
exclude = [".git", ".venv", ".nox", "**/__pycache__", "~*", "allure-results"]

[tool.black]
line-length = 80
exclude = '''
/(
    \.git
  | \.venv
  | \.nox
  | \.__pycache__
  | allure-results
)/
'''

[tool.isort]
line_length = 80
profile = "black"
skip = [".venv", ".nox", "allure-results"]

[tool.autoflake]
ignore_init_module_imports = true
remove_all_unused_imports = true
in_place = true
recursive = true
quiet = true
exclude = ["\\.venv", "\\.nox", "allure-results"]
