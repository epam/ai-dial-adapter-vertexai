[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "aidial-adapter-vertexai"
version = "0.0.0"
description = "DIAL adapter for Google Vertex AI"
authors = [{ name = "EPAM RAIL", email = "SpecialEPM-DIALDevTeam@epam.com" }]
license = "Apache-2.0"
readme = "README.md"
keywords = ["ai"]
classifiers = ["Topic :: Software Development :: Libraries :: Python Modules"]
requires-python = ">=3.11,<4"
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://epam-rail.com"
Documentation = "https://epam-rail.com/dial_api"
Repository = "https://github.com/epam/ai-dial-adapter-vertexai/"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
aidial-sdk = { version = "0.39.0", extras = ["telemetry"] }
aidial-adapter-anthropic = "0.17.0"
anthropic = { version = "0.105.0", extras = ["vertex"] }
fastapi = "0.135.1"
google-cloud-aiplatform = "1.138.0"
google-auth = "2.49.0"
google-genai = "1.72.0"
openai = "1.107.3"
pydantic = "2.11.2"
uvicorn = "0.22.0"
pillow = "12.3.0"
pypdf = { version = "6.15.0", extras = ["crypto"] }
numpy = "2.0.0"
aiohttp = "3.14.3"
azure-identity = "1.25.1"
mistralai = { version = "2.4.3", extras = ["gcp"] }
httpx = "0.28.1"

[tool.poetry.group.test.dependencies]
pytest = "9.0.3"
pytest-asyncio = "1.3.0"
pytest-dotenv = "^0.5.2"
pytest-xdist = "^3.5.0"
pytest-html = "^4.1.1"
pytest-sugar = "^1.0.0"
pytest-timeout = "^2.3.1"
pytest-env = "1.1.1"
allure-pytest = "^2.13.5"
python-dotenv = "1.2.2"
asgi-lifespan = "^2.1.0"

[tool.poetry.group.lint.dependencies]
pyright = "1.1.389"
ruff = "0.12.11"

[tool.poetry.group.dev.dependencies]
nox = "^2023.4.22"
google-auth-oauthlib = "^1.4.0"
pre-commit = "^4.5.1"

[tool.pytest.ini_options]
addopts = "-n=auto --asyncio-mode=auto --self-contained-html --html=pytest.html --alluredir=allure-results --clean-alluredir --timeout=120"
env_override_existing_values = 1
env = ["PYDANTIC_V2=1"]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # Warning from aiohttp
    "ignore:Sending a large body directly with raw bytes might lock the event loop. You should probably pass an io.BytesIO object instead:ResourceWarning",
    "ignore:pkg_resources is deprecated as an API:UserWarning",
    # muting warnings from google.rpc https://github.com/googleapis/google-cloud-python/issues/11184 and opentelemetry packages
    "ignore:Deprecated call to `pkg_resources\\.declare_namespace\\('.*'\\):DeprecationWarning",
    "ignore::DeprecationWarning:google.rpc",
    "ignore::DeprecationWarning:opentelemetry.instrumentation.dependencies",
    "ignore:Inheritance class AiohttpClientSession from ClientSession is discouraged:DeprecationWarning",
    # vertexai is deprecated; remove it once this is fixed:
    # https://github.com/epam/ai-dial-adapter-vertexai/issues/398
    "ignore:This feature is deprecated as of June 24:UserWarning",
    # Warnings from the anthropic adapter:
    "ignore:Pydantic serializer warnings:UserWarning",
]
markers = ["slow: marker for slow running tests"]

[tool.pyright]
typeCheckingMode = "basic"
reportUnusedVariable = "error"
reportIncompatibleMethodOverride = "error"

[tool.ruff]
target-version = "py311"
line-length = 80

[tool.ruff.lint]
select = [
    "ERA",  # flake8-eradicate
    "B",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "B9",   # flake8-bugbear
    "E",    # pycodestyle
    "W",    # pycodestyle
    "F",    # pyflakes
    "I",    # flake8-isort
    "S",    # flake8-bandit
    "FURB", # refurb,
    "UP",   # pyupgrade
]
ignore = [
    "E501", # string literal is too long
    "S101", # Use of `assert` detected
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "B011", # Do not `assert False`
]
